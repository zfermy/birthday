<!doctype html>
<html lang="zh-CN" class="locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060914">
  <title>小萍 · 十八岁生日快乐</title>
  <meta name="description" content="一封只写给小萍的十八岁生日信">
  <meta property="og:title" content="小萍 · 十八岁生日快乐">
  <meta property="og:description" content="有一封信,想在你十八岁这天交给你。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>.hero > :not(.moon){opacity:1!important}.reveal{opacity:1!important;filter:none!important;transform:none!important}.intro{display:none!important}html.locked,html.locked body{overflow:auto!important}</style></noscript>
</head>
<body>
  <div class="sky-bg" aria-hidden="true"></div>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- 开屏 -->
  <div class="intro" id="intro">
    <div class="intro-inner">
      <i class="spark" aria-hidden="true"></i>
      <p class="intro-to">To <span data-fullname>严傲萍</span></p>
      <p class="intro-sub" id="intro-sub">有一封信,想在你十八岁这天交给你。</p>
      <button class="btn" id="open" type="button">拆 开</button>
      <p class="music-hint" id="music-hint" aria-hidden="true">轻触屏幕,开启音乐 ♪</p>
    </div>
  </div>

  <!-- 音乐开关 -->
  <button class="music" id="music" type="button" aria-label="音乐开关" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>
    </svg>
  </button>

  <main>
    <!-- 首屏 -->
    <header class="hero" id="top">
      <div class="moon" aria-hidden="true"></div>
      <div class="avatar" id="avatar" style="--i:0" hidden><img alt=""></div>
      <p class="eyebrow" id="date" style="--i:1">2026 · 11 · 27</p>
      <div class="age" id="age" style="--i:2">18</div>
      <h1 class="title" style="--i:3"><span data-name>小萍</span>,<span class="nb">生日快乐</span></h1>
      <p class="tagline" id="tagline" style="--i:4"></p>
      <div class="cdwrap" style="--i:5">
        <p class="cd-label" id="cd-label"></p>
        <div class="cd" id="cd">
          <div><b id="cd-d">0</b><small>天</small></div>
          <div><b id="cd-h">00</b><small>时</small></div>
          <div><b id="cd-m">00</b><small>分</small></div>
          <div><b id="cd-s">00</b><small>秒</small></div>
        </div>
      </div>
      <a class="scroll" href="#letter" style="--i:6" aria-label="向下滑动"><span></span></a>
    </header>

    <!-- 第一章:信 -->
    <section class="sec" id="letter">
      <div class="sec-head reveal">
        <p class="kicker">Chapter 01</p>
        <h2>To <span data-name>小萍</span></h2>
        <i class="orn"></i>
      </div>
      <div class="letter">
        <div id="letter-body"></div>
      </div>
    </section>

    <!-- 第二章:十八颗星 -->
    <section class="sec" id="stars">
      <div class="sec-head reveal">
        <p class="kicker">Chapter 02</p>
        <h2>十八颗星</h2>
        <i class="orn"></i>
        <p class="sub">每一颗,都是一份只给你的祝福。</p>
      </div>
      <div class="sky reveal" id="sky">
        <svg id="sky-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="sky-name" id="sky-name">傲萍座</div>
      </div>
      <div class="wish" id="wish-card" aria-live="polite">
        <p class="no" id="wish-no">已点亮 0 / 18</p>
        <p class="txt" id="wish-text"></p>
      </div>
      <p class="progress"><span id="prog">0</span> / <span id="prog-n">18</span></p>
    </section>

    <!-- 第三章:相册 -->
    <section class="sec sec-wide" id="photos">
      <div class="sec-head reveal">
        <p class="kicker">Chapter 03</p>
        <h2>你的光</h2>
        <i class="orn"></i>
        <p class="sub" id="photos-sub"></p>
      </div>
      <div class="gal reveal">
        <button class="arrow prev" id="g-prev" type="button" aria-label="上一张">‹</button>
        <div class="track" id="track"></div>
        <button class="arrow next" id="g-next" type="button" aria-label="下一张">›</button>
      </div>
    </section>

    <!-- 第四章:写给明年夏天 -->
    <section class="sec" id="future">
      <div class="sec-head reveal">
        <p class="kicker" id="future-kicker">Summer 2027</p>
        <h2 id="future-title">写给明年夏天的你</h2>
        <i class="orn"></i>
      </div>
      <div class="future" id="future-body"></div>
    </section>

    <!-- 第五章:许愿 -->
    <section class="sec" id="cake">
      <div class="sec-head reveal">
        <p class="kicker">Chapter 05</p>
        <h2>许个愿吧</h2>
        <i class="orn"></i>
      </div>
      <div class="cake-wrap reveal" id="cake-wrap">
        <svg class="cake" viewBox="0 0 240 220" aria-label="生日蛋糕" role="img">
          <defs>
            <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb5d2"/><stop offset="1" stop-color="#f07fae"/></linearGradient>
            <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6cbff"/><stop offset="1" stop-color="#a592f0"/></linearGradient>
            <linearGradient id="gI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f6e7d2"/></linearGradient>
            <linearGradient id="gF" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#fff2a8"/></linearGradient>
          </defs>
          <ellipse cx="120" cy="206" rx="108" ry="10" fill="rgba(0,0,0,.35)"/>
          <rect x="30" y="140" width="180" height="62" rx="14" fill="url(#gA)"/>
          <path d="M30 152 q15 18 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V140 H30 Z" fill="url(#gI)"/>
          <text x="120" y="184" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" fill-opacity=".92">18</text>
          <rect x="60" y="96" width="120" height="46" rx="12" fill="url(#gB)"/>
          <path d="M60 108 q10 14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V96 H60 Z" fill="url(#gI)"/>
          <g>
            <rect x="86" y="66" width="8" height="32" rx="3" fill="#ffe8a3"/>
            <rect x="116" y="66" width="8" height="32" rx="3" fill="#ffd0e2"/>
            <rect x="146" y="66" width="8" height="32" rx="3" fill="#cfe3ff"/>
            <g transform="translate(90,62)"><path class="flame" d="M0 -17 C7 -7 6 4 0 4 C-6 4 -7 -7 0 -17Z" fill="url(#gF)"/></g>
            <g transform="translate(120,62)"><path class="flame f2" d="M0 -17 C7 -7 6 4 0 4 C-6 4 -7 -7 0 -17Z" fill="url(#gF)"/></g>
            <g transform="translate(150,62)"><path class="flame f3" d="M0 -17 C7 -7 6 4 0 4 C-6 4 -7 -7 0 -17Z" fill="url(#gF)"/></g>
            <path class="smoke" d="M90 54 q-6 -9 0 -16 t0 -16"/>
            <path class="smoke s2" d="M120 54 q-6 -9 0 -16 t0 -16"/>
            <path class="smoke s3" d="M150 54 q-6 -9 0 -16 t0 -16"/>
          </g>
        </svg>
      </div>
      <p class="cake-msg" id="cake-msg"></p>
      <div class="center"><button class="btn" id="blow" type="button">吹灭蜡烛</button></div>
    </section>

    <!-- 结尾 -->
    <footer class="finale" id="finale">
      <div class="finale-text reveal" id="finale-text"></div>
      <p class="from reveal" id="from"></p>
      <div class="center reveal"><button class="btn ghost" id="replay" type="button">再放一次烟花</button></div>
      <p class="tip reveal">屏幕任意处轻点,都有烟花 ✦</p>
    </footer>
  </main>

  <!-- 大图预览 -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="照片预览">
    <img id="lb-img" alt="">
    <p id="lb-cap"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
